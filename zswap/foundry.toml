[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
# The settings the deployed root was compiled with (Etherscan: solc 0.8.36, viaIR, 9,999,999 runs).
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 9_999_999
via_ir = true
evm_version = "prague"
fs_permissions = [
    { access = "read", path = "./dapp" },
    { access = "read", path = "./out" },
]

[fuzz]
runs = 256

# zSwapLink was deployed at 200 optimizer runs (it travels inside a DAO proposal's calldata).
[[profile.default.additional_compiler_profiles]]
name = "link"
via_ir = true
optimizer = true
optimizer_runs = 200

[[profile.default.compilation_restrictions]]
paths = "src/zSwapLink.sol"
max_optimizer_runs = 200
